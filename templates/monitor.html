<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spot check monitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="{{ url_for('static', filename='js/sim-audio.js') }}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
    <style>
        /* ================= TOKENS =================
           Spot Check: a light, ward-style vital signs device. Cool white, dark numerals,
           parameter colours deep enough to read on any screen in daylight. */
        :root {
            --bg: #e9edf1;
            --surface: #ffffff;
            --line: #cfd6dd;
            --ink: #13202d;            /* numerals and primary text */
            --ink-2: #5b6876;          /* labels, units */
            --ink-3: #98a3ae;          /* placeholders */
            --c-bp: #13202d;
            --c-spo2: #0068b0;
            --c-pulse: #087a3e;
            --c-temp: #6a3fb5;
            --alarm-high: #d4141b;
            --alarm-med: #ffc400;
            --amber: #b37400;
            --num: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
            --ui: 'Barlow', -apple-system, 'Segoe UI', Roboto, sans-serif;
            /* names still used by script-set classes */
            --red: var(--alarm-high); --green: var(--c-pulse); --text-dim: var(--ink-3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg); color: var(--ink); font-family: var(--ui);
            width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; position: fixed;
            display: grid; grid-template-rows: 52px 1fr 64px;
            -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
        }
        button { font: inherit; color: inherit; }
        :focus-visible { outline: 3px solid var(--c-spo2); outline-offset: 2px; }

        /* ================= STATUS BAR ================= */
        .status-bar {
            display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px;
            background: var(--surface); border-bottom: 1px solid var(--line);
        }
        .status-left, .status-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .connection-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--alarm-high); flex-shrink: 0; }
        .connection-dot.online { background: var(--c-pulse); }
        .status-label { font-size: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
        .clock { font-family: var(--num); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
        .alarm-badge {
            display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 6px;
            font-size: 14px; font-weight: 600; white-space: nowrap; color: var(--ink-2); background: var(--bg);
        }
        .alarm-badge .alarm-icon { font-size: 14px; }
        .alarm-badge.alarming { background: var(--alarm-high); color: #fff; animation: flash-high 0.5s steps(1) infinite; }        /* 2 Hz */
        .alarm-badge.alarming-medium { background: var(--alarm-med); color: #000; animation: flash-med 1.67s steps(1) infinite; } /* 0.6 Hz */
        .alarm-badge.silenced { background: #fff4d6; color: var(--amber); }
        .alarm-badge.sound-blocked { display: none; background: #ff9f1c; color: #000; cursor: pointer; }
        .alarm-badge.sound-blocked.active { display: flex; }
        @keyframes flash-high { 50% { background: #7a0a0e; } }
        @keyframes flash-med { 50% { background: #fff1bf; } }
        .silence-timer { font-variant-numeric: tabular-nums; }
        .vol-strip { display: flex; align-items: center; gap: 4px; }
        .vol-label { font-size: 13px; font-weight: 600; color: var(--ink-2); min-width: 40px; text-align: center; }
        .icon-btn {
            width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
            display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; color: var(--ink-2);
        }
        .icon-btn:active { background: var(--bg); }
        .icon-btn.power { color: var(--alarm-high); }

        /* ================= MEASUREMENTS =================
           BP is the main measurement on a spot-check device, so it gets the most space. */
        .main-content {
            display: grid; gap: 8px; padding: 8px; min-height: 0;
            grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 0.8fr;
            grid-template-areas: "sys dia spo2" "sys dia hr" "temp temp bp";
        }
        .bottom-row { display: contents; }
        #card_sys { grid-area: sys; } #card_dia { grid-area: dia; } #card_spo2 { grid-area: spo2; }
        #card_hr { grid-area: hr; } #card_temp { grid-area: temp; } #bp_btn { grid-area: bp; }
        .vital-card {
            --pc: var(--ink);
            position: relative; min-height: 0; overflow: hidden;
            background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
            display: flex; align-items: center; justify-content: center; container-type: size;
        }
        .card-bp { --pc: var(--c-bp); } .card-spo2 { --pc: var(--c-spo2); }
        .card-hr { --pc: var(--c-pulse); } .card-temp { --pc: var(--c-temp); }
        .card-label-group { position: absolute; top: 10px; left: 14px; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; max-width: 62%; }
        .card-label { font-size: 17px; font-weight: 600; color: var(--pc); }
        .card-unit { font-size: 13px; color: var(--ink-2); }
        .alarm-limits {
            position: absolute; top: 10px; right: 14px; text-align: right;
            font-size: 12px; line-height: 1.3; color: var(--ink-2); font-variant-numeric: tabular-nums;
        }
        .alarm-limits .limit-high, .alarm-limits .limit-low { color: inherit; }
        .card-value {
            font-family: var(--num); font-weight: 600; line-height: 1; letter-spacing: -0.5px;
            font-variant-numeric: tabular-nums; color: var(--ink-3);
            font-size: clamp(40px, 11vh, 140px); margin-top: 10px;
        }
        .card-value.active { color: var(--pc); }
        .card-message { font-family: var(--ui); font-size: 18px; font-weight: 500; letter-spacing: 0; color: var(--ink-3); }
        @supports (container-type: size) {
            .card-value { font-size: min(52cqh, 38cqw); }
            #card_temp .card-value { font-size: min(56cqh, 24cqw); }
        }
        .card-timestamp { position: absolute; bottom: 10px; right: 14px; font-size: 13px; color: var(--ink-2); }
        .card-map { position: absolute; bottom: 10px; left: 14px; font-size: 15px; font-weight: 600; color: var(--ink-2); }
        .blinking { animation: blink-value 1s steps(1) infinite; }
        @keyframes blink-value { 50% { opacity: 0.25; } }

        /* pulse strength bar beside the pulse rate */
        .pulse-card-inner { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; gap: 6%; padding: 34px 18px 10px; }
        .pulse-bar-track { width: 14px; height: 60%; border-radius: 4px; background: var(--bg); display: flex; align-items: flex-end; overflow: hidden; }
        .pulse-bar-fill { width: 100%; height: 0%; background: var(--c-pulse); transition: height 0.1s; }

        /* IEC visual alarm signals */
        .vital-card.alarm-active { animation: card-high 0.5s steps(1) infinite; }    /* red, 2 Hz */
        .vital-card.alarm-medium { animation: card-med 1.67s steps(1) infinite; }    /* yellow, 0.6 Hz */
        @keyframes card-high { 0% { background: var(--alarm-high); border-color: var(--alarm-high); } 50% { background: var(--surface); } }
        @keyframes card-med { 0% { background: var(--alarm-med); border-color: var(--alarm-med); } 50% { background: var(--surface); } }
        .vital-card.alarm-active .card-value.active, .vital-card.alarm-active .card-label { animation: ink-high 0.5s steps(1) infinite; }
        @keyframes ink-high { 0% { color: #fff; } 50% { color: var(--pc); } }

        /* Start BP */
        .bp-btn {
            border: 0; border-radius: 10px; background: var(--ink); color: #fff; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            font-size: 20px; font-weight: 600; min-height: 0;
        }
        .bp-btn:active { background: #2a3a4a; }
        .bp-btn:disabled { cursor: default; }
        .bp-btn .bp-icon { display: none; }
        .bp-btn .bp-pressure { font-family: var(--num); font-size: 34px; line-height: 1; }
        .bp-btn.inflating { background: #34495e; }
        .bp-btn.measuring { background: #34495e; }

        /* ================= ACTION BAR ================= */
        .action-bar {
            display: grid; grid-template-columns: 2fr 1fr; gap: 8px; padding: 8px;
            background: var(--surface); border-top: 1px solid var(--line);
        }
        .action-btn {
            border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--ink-2);
        }
        .action-btn:active { background: var(--bg); }
        .action-btn .action-icon { font-size: 16px; }
        .action-btn.silence-btn.alarming { background: var(--alarm-high); border-color: var(--alarm-high); color: #fff; }
        .action-btn.silence-btn.silenced { background: #fff4d6; border-color: var(--alarm-med); color: var(--amber); }
        .silence-countdown { font-variant-numeric: tabular-nums; }

        /* ================= STANDBY (power-on) ================= */
        .overlay-screen {
            position: fixed; inset: 0; z-index: 1000; background: var(--surface);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
            transition: opacity 0.4s;
        }
        .overlay-screen.fade-out { opacity: 0; pointer-events: none; }
        .power-ring {
            width: 112px; height: 112px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface);
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-3);
            transition: border-color 0.3s, color 0.3s;
        }
        .power-ring.active { border-color: var(--c-pulse); color: var(--c-pulse); }
        .power-ring .icon { width: 40px; height: 40px; }
        .power-text { font-size: 16px; font-weight: 600; color: var(--ink-2); }
        .power-text.active { color: var(--c-pulse); }
        .startup-msg { font-size: 14px; color: var(--ink-2); opacity: 0; transition: opacity 0.3s; }
        .startup-msg.visible { opacity: 1; }
        .progress-track { width: 220px; height: 4px; border-radius: 2px; background: var(--bg); overflow: hidden; opacity: 0; }
        .progress-track.visible { opacity: 1; }
        .progress-fill { height: 100%; width: 0%; background: var(--c-pulse); transition: width 3s linear; }
        .brand-label { position: absolute; bottom: 28px; font-size: 13px; color: var(--ink-3); }

        /* ================= RESPONSIVE ================= */
        @media (orientation: portrait) {
            .main-content {
                grid-template-columns: 1fr 1fr; grid-template-rows: 1.15fr 1fr 0.85fr;
                grid-template-areas: "sys dia" "spo2 hr" "temp bp";
            }
            .status-label, .vol-strip { display: none; }
        }
        @media (max-height: 520px) {
            body { grid-template-rows: 44px 1fr 52px; }
            .card-label { font-size: 14px; } .card-unit, .alarm-limits, .card-timestamp { font-size: 11px; }
            .card-label-group { top: 6px; left: 10px; } .alarm-limits { top: 6px; right: 10px; }
            .status-label { display: none; }
        }
        @media (prefers-reduced-motion: reduce) { .overlay-screen, .power-ring, .startup-msg, .progress-fill { transition: none; } }
    </style>
</head>
<body>

<!-- ===== STANDBY SCREEN ===== -->
<div class="overlay-screen" id="standby_screen">
    <button class="power-ring" id="power_ring" onclick="startBoot()" aria-label="Power on">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
    </button>
    <div class="power-text" id="power_text">Press to start</div>
    <div class="startup-msg" id="startup_msg">Starting…</div>
    <div class="progress-track" id="progress_track"><div class="progress-fill" id="progress_fill"></div></div>
    <div class="brand-label">Spot check vital signs</div>
</div>

<!-- ===== STATUS BAR ===== -->
<header class="status-bar">
    <div class="status-left">
        <div class="connection-dot" id="conn_dot"></div>
        <span class="status-label" id="sys_status_text">Offline</span>
    </div>
    <div class="status-right">
        <div class="alarm-badge sound-blocked" id="sound_blocked" onclick="SimAudio.unlock()">🔇 Tap for sound</div>
        <div class="alarm-badge" id="alarm_badge">
            <span class="alarm-icon" id="alarm_icon">🔔</span>
            <span id="alarm_text">No alarms</span>
            <span class="silence-timer" id="silence_timer"></span>
        </div>
        <div class="vol-strip" aria-label="Volume">
            <button class="icon-btn" onclick="adjustVol(-0.1)" aria-label="Volume down">−</button>
            <span class="vol-label" id="vol_label">50%</span>
            <button class="icon-btn" onclick="adjustVol(0.1)" aria-label="Volume up">+</button>
        </div>
        <span class="clock" id="clock_display">00:00</span>
        <button class="icon-btn power" onclick="location.reload()" aria-label="Power off">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
        </button>
    </div>
</header>

<!-- ===== MEASUREMENTS ===== -->
<main class="main-content">
    <div class="vital-card card-bp" id="card_sys">
        <div class="card-label-group"><span class="card-label">Systolic</span><span class="card-unit">mmHg</span></div>
        <div class="alarm-limits"><span class="limit-high">▲ 140</span><br><span class="limit-low">▼ 90</span></div>
        <div class="card-value" id="sys_v">---</div>
        <div class="card-timestamp" id="sys_timestamp"></div>
    </div>
    <div class="vital-card card-bp" id="card_dia">
        <div class="card-label-group"><span class="card-label">Diastolic</span><span class="card-unit">mmHg</span></div>
        <div class="alarm-limits"><span class="limit-high">▲ 90</span><br><span class="limit-low">▼ 60</span></div>
        <div class="card-value" id="dia_v">---</div>
        <div class="card-map" id="map_display"></div>
        <div class="card-timestamp" id="dia_timestamp"></div>
    </div>
    <div class="vital-card card-spo2" id="card_spo2">
        <div class="card-label-group"><span class="card-label">SpO₂</span><span class="card-unit">%</span></div>
        <div class="alarm-limits"><span class="limit-low">▼ 90</span></div>
        <div class="card-value" id="spo2_v">---</div>
    </div>
    <div class="vital-card card-hr" id="card_hr">
        <div class="card-label-group"><span class="card-label">Pulse</span><span class="card-unit">bpm</span></div>
        <div class="alarm-limits"><span class="limit-high">▲ 120</span><br><span class="limit-low">▼ 50</span></div>
        <div class="pulse-card-inner">
            <div class="card-value" id="hr_v">---</div>
            <div class="pulse-bar-track"><div class="pulse-bar-fill" id="pulse_bar"></div></div>
        </div>
    </div>
    <div class="bottom-row">
        <div class="vital-card card-temp" id="card_temp">
            <div class="card-label-group"><span class="card-label">Temperature</span><span class="card-unit">°C</span></div>
            <div class="alarm-limits"><span class="limit-high">▲ 38.5</span><br><span class="limit-low">▼ 35.0</span></div>
            <div class="card-value" id="temp_v">--.-</div>
        </div>
        <button class="bp-btn" id="bp_btn" onclick="runBP()"><span class="bp-icon">⊘</span>Start BP</button>
    </div>
</main>

<!-- ===== ACTION BAR ===== -->
<nav class="action-bar">
    <button class="action-btn silence-btn" id="silence_btn" onclick="toggleSilence()">
        <span class="action-icon" id="silence_icon">🔔</span>
        <span class="action-label" id="silence_label">Pause alarms</span>
        <span class="silence-countdown" id="silence_countdown"></span>
    </button>
    <button class="action-btn fullscreen-btn" onclick="toggleFullscreen()">
        <span class="action-label">Full screen</span>
    </button>
</nav>

<script>
var socket = io({ transports: ['websocket'], upgrade: false });

// ==================== STATE ====================
var targetHR = 60, targetSpO2 = 98, t_sys = 120, t_dia = 80;
var hr_on = false, spo2_on = false, bp_attached = false, cycling = false, signalQuality = 'normal';
var calc_hr = false, calc_spo2 = false;
var hrDrift = 0, spo2Drift = 0;
var masterVolume = 0.5;
var isMuted = false;
var isLoopRunning = false;

// ==================== ALARM STATE ====================
var alarmsSilenced = false;
var silenceCountdown = 0;
var silenceInterval = null;
var alarmLimits = {
    hr_high: 120, hr_low: 50,
    spo2_low: 90,
    sys_high: 140, sys_low: 90,
    dia_high: 90, dia_low: 60,
    temp_high: 38.5, temp_low: 35.0
};
var currentAlarms = { hr: false, spo2: false, sys: false, dia: false, temp: false };

var urlParams = new URLSearchParams(window.location.search);
var roomCode = urlParams.get('room');
// Sound: static/js/sim-audio.js (shared with the Advanced monitor)
SimAudio.init();
SimAudio.setMasterVolume(masterVolume);
SimAudio.onBlockedChange(updateSoundHint);
function updateSoundHint() {
    document.getElementById('sound_blocked').classList.toggle('active', isPoweredOn && SimAudio.isBlocked());
}

// ==================== UTILITIES ====================
function calculateMAP(sys, dia) { return Math.round((parseInt(sys) + 2 * parseInt(dia)) / 3); }
function getCurrentTimestamp() {
    var now = new Date();
    return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}

function updateClock() {
    var now = new Date();
    document.getElementById('clock_display').innerText =
        now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}
setInterval(updateClock, 1000);
updateClock();

// ==================== VOLUME ====================
function adjustVol(amt) {
    masterVolume = Math.min(1.0, Math.max(0, masterVolume + amt));
    isMuted = masterVolume === 0;
    SimAudio.setMasterVolume(masterVolume);
    document.getElementById('vol_label').innerText = isMuted ? 'OFF' : Math.round(masterVolume * 100) + '%';
}

// ==================== ALARM SYSTEM ====================
function checkAlarms() {
    var anyAlarm = false;

    if (hr_on && !calc_hr) {
        var hr = parseInt(targetHR) + hrDrift;
        // no pulse is an alarm in its own right
        currentAlarms.hr = parseInt(targetHR) === 0 || hr > alarmLimits.hr_high || hr < alarmLimits.hr_low;
    } else { currentAlarms.hr = false; }

    if (spo2_on && !calc_spo2 && targetHR > 0) {
        var spo2 = Math.min(100, parseInt(targetSpO2) + spo2Drift);
        currentAlarms.spo2 = spo2 < alarmLimits.spo2_low;
    } else { currentAlarms.spo2 = false; }

    var tempEl = document.getElementById('temp_v');
    var tempVal = parseFloat(tempEl.innerText);
    if (!isNaN(tempVal) && tempVal > 10) {
        currentAlarms.temp = tempVal > alarmLimits.temp_high || tempVal < alarmLimits.temp_low;
    } else { currentAlarms.temp = false; }

    if (bp_attached && !cycling) {
        var sysEl = document.getElementById('sys_v');
        var diaEl = document.getElementById('dia_v');
        var sysVal = parseInt(sysEl.innerText);
        var diaVal = parseInt(diaEl.innerText);
        if (!isNaN(sysVal) && sysVal > 0) {
            currentAlarms.sys = sysVal > alarmLimits.sys_high || sysVal < alarmLimits.sys_low;
            currentAlarms.dia = diaVal > alarmLimits.dia_high || diaVal < alarmLimits.dia_low;
        } else { currentAlarms.sys = false; currentAlarms.dia = false; }
    } else { currentAlarms.sys = false; currentAlarms.dia = false; }

    var priority = getAlarmPriority();
    var highClass = 'alarm-active';
    var medClass = 'alarm-medium';

    // Clear both classes first
    ['card_hr','card_spo2','card_temp','card_sys','card_dia'].forEach(function(id) {
        document.getElementById(id).classList.remove(highClass, medClass);
    });

    var cls = (priority === 'high') ? highClass : medClass;
    if (currentAlarms.hr)   document.getElementById('card_hr').classList.add(cls);
    if (currentAlarms.spo2) document.getElementById('card_spo2').classList.add(cls);
    if (currentAlarms.temp) document.getElementById('card_temp').classList.add(cls);
    if (currentAlarms.sys)  document.getElementById('card_sys').classList.add(cls);
    if (currentAlarms.dia)  document.getElementById('card_dia').classList.add(cls);

    for (var k in currentAlarms) { if (currentAlarms[k]) anyAlarm = true; }

    var badge = document.getElementById('alarm_badge');
    var icon = document.getElementById('alarm_icon');
    var text = document.getElementById('alarm_text');
    var silBtn = document.getElementById('silence_btn');
    var silIcon = document.getElementById('silence_icon');
    var silLabel = document.getElementById('silence_label');

    if (anyAlarm && !alarmsSilenced) {
        badge.className = 'alarm-badge ' + (getAlarmPriority() === 'high' ? 'alarming' : 'alarming-medium');
        icon.innerText = '🔔'; text.innerText = 'Alarm';
        silBtn.className = 'action-btn silence-btn alarming';
        silIcon.innerText = '🔕'; silLabel.innerText = 'Pause alarms';
        document.getElementById('silence_countdown').innerText = '';
    } else if (anyAlarm && alarmsSilenced) {
        badge.className = 'alarm-badge silenced';
        icon.innerText = '🔕'; text.innerText = 'Alarms paused';
        silBtn.className = 'action-btn silence-btn silenced';
        silIcon.innerText = '🔕'; silLabel.innerText = 'Resume alarms';
    } else {
        badge.className = 'alarm-badge';
        icon.innerText = '🔔'; text.innerText = 'No alarms';
        silBtn.className = 'action-btn silence-btn';
        silIcon.innerText = '🔔'; silLabel.innerText = 'Pause alarms';
        document.getElementById('silence_countdown').innerText = '';
        if (alarmsSilenced) cancelSilence();
    }

    // The audio module repeats the IEC burst for this priority until it changes
    SimAudio.setAlarm(isPoweredOn && anyAlarm && !alarmsSilenced ? getAlarmPriority() : 'none');
}

function toggleSilence() {
    var anyAlarm = false;
    for (var k in currentAlarms) { if (currentAlarms[k]) anyAlarm = true; }
    if (!anyAlarm) return;
    if (alarmsSilenced) { cancelSilence(); }
    else {
        alarmsSilenced = true;
        silenceCountdown = 120;
        updateSilenceDisplay();
        if (silenceInterval) clearInterval(silenceInterval);
        silenceInterval = setInterval(function() {
            silenceCountdown--;
            updateSilenceDisplay();
            if (silenceCountdown <= 0) cancelSilence();
        }, 1000);
    }
}

function cancelSilence() {
    alarmsSilenced = false;
    silenceCountdown = 0;
    if (silenceInterval) { clearInterval(silenceInterval); silenceInterval = null; }
    document.getElementById('silence_timer').innerText = '';
}

function updateSilenceDisplay() {
    var mins = Math.floor(silenceCountdown / 60);
    var secs = silenceCountdown % 60;
    var timeStr = mins + ':' + (secs < 10 ? '0' : '') + secs;
    document.getElementById('silence_timer').innerText = timeStr;
    document.getElementById('silence_countdown').innerText = timeStr;
    // IEC: periodic reminder beep while silenced
    if (silenceCountdown % 30 === 0 && silenceCountdown > 0) SimAudio.reminder();
}

// ==================== IEC 60601-1-8 ALARM SYSTEM ====================
function getAlarmPriority() {
    // HIGH: life-threatening
    var hr = parseInt(targetHR) + hrDrift;
    if (hr_on && !calc_hr && targetHR == 0) return 'high';                    // asystole
    if (spo2_on && !calc_spo2 && (parseInt(targetSpO2) + spo2Drift) < 80) return 'high'; // critical desat
    var sysVal = parseInt(document.getElementById('sys_v').innerText);
    if (!isNaN(sysVal) && sysVal > 0 && sysVal < 60) return 'high';          // severe hypotension

    // MEDIUM: out of range
    if (currentAlarms.hr || currentAlarms.spo2 || currentAlarms.sys || currentAlarms.dia || currentAlarms.temp) return 'medium';

    return 'none';
}

// ==================== BOOT ====================
function startBoot() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function(){});
    }
    SimAudio.unlock();   // inside the tap: iOS/Android only allow sound started by a user action

    var ring = document.getElementById('power_ring');
    var ptxt = document.getElementById('power_text');
    var msg = document.getElementById('startup_msg');
    var track = document.getElementById('progress_track');
    var fill = document.getElementById('progress_fill');

    ring.classList.add('active');
    ptxt.classList.add('active');
    ptxt.innerText = 'Powering on';

    setTimeout(function() {
        msg.classList.add('visible');
        track.classList.add('visible');
        fill.style.width = '100%';

        var msgs = ['Running self-test…', 'Checking sensors…', 'Connecting…', 'Ready'];
        msgs.forEach(function(m, i) {
            setTimeout(function() { msg.innerText = m; }, (i + 1) * 700);
        });

        setTimeout(function() {
            document.getElementById('standby_screen').classList.add('fade-out');
            setTimeout(function() {
                document.getElementById('standby_screen').style.display = 'none';
                updateDisplay();
                runAnimationLoop();
                startDriftTimer();
                isPoweredOn = true;
                requestWakeLock();
                updateSoundHint();
                checkAlarms();
            }, 500);
        }, 3200);
    }, 300);

    socket.emit('monitor_powered_on', { room: roomCode });
}

// ==================== DISPLAY ====================
function updateDisplay() {
    var hrEl = document.getElementById('hr_v');
    var spo2El = document.getElementById('spo2_v');
    var sysEl = document.getElementById('sys_v');
    var diaEl = document.getElementById('dia_v');

    if (hr_on) {
        if (calc_hr) {
            hrEl.innerText = '---';
            hrEl.className = 'card-value blinking';
        } else {
            var dHR = Math.max(0, parseInt(targetHR) + hrDrift);
            if (parseInt(targetHR) > 0) { hrEl.innerText = dHR; hrEl.className = 'card-value active'; }
            else { hrEl.innerHTML = '<span class="card-message">No pulse</span>'; hrEl.className = 'card-value'; }
        }
    } else {
        hrEl.innerHTML = '<span class="card-message">Attach probe</span>';
        hrEl.className = 'card-value';
    }

    if (spo2_on) {
        if (calc_spo2) {
            spo2El.innerText = '---';
            spo2El.className = 'card-value blinking';
        } else {
            var dSPO2 = Math.min(100, Math.max(0, parseInt(targetSpO2) + spo2Drift));
            // a pulse oximeter cannot read saturation without a pulse
            if (parseInt(targetHR) > 0) { spo2El.innerText = dSPO2; spo2El.className = 'card-value active'; }
            else { spo2El.innerText = '---'; spo2El.className = 'card-value blinking'; }
        }
    } else {
        spo2El.innerHTML = '<span class="card-message">Attach probe</span>';
        spo2El.className = 'card-value';
    }

    if (!bp_attached && !cycling) {
        sysEl.innerHTML = '<span class="card-message">No cuff</span>';
        sysEl.className = 'card-value';
        diaEl.innerHTML = '<span class="card-message">No cuff</span>';
        diaEl.className = 'card-value';
        document.getElementById('map_display').innerText = '';
        document.getElementById('sys_timestamp').innerText = '';
        document.getElementById('dia_timestamp').innerText = '';
    }

    checkAlarms();
}

// ==================== BEEP ====================
function playBeep() {
    if (!hr_on || targetHR <= 0 || calc_hr) return;
    // pitch follows SpO2 while the probe has a reading
    SimAudio.beep(spo2_on && !calc_spo2 ? Math.min(100, parseInt(targetSpO2) + spo2Drift) : null);
}

// ==================== ANIMATION LOOP ====================
function runAnimationLoop() {
    if (isLoopRunning) return;
    isLoopRunning = true;
    var animate = function() {
        if (hr_on && targetHR > 0 && !calc_hr) {
            var h = (signalQuality === 'poor') ? (Math.random() * 45 + 15) + '%' : '100%';
            var bar = document.getElementById('pulse_bar');
            if (bar) bar.style.height = h;
            playBeep();
            setTimeout(function() { if (bar) bar.style.height = '0%'; }, 150);
            var interval = (60 / targetHR) * 1000;
            setTimeout(animate, interval);
        } else {
            var bar = document.getElementById('pulse_bar');
            if (bar) bar.style.height = '0%';
            setTimeout(animate, 1000);
        }
    };
    animate();
}

function startDriftTimer() {
    setInterval(function() {
        if (hr_on && targetHR > 0) {
            hrDrift = Math.floor(Math.random() * 5) - 2;
            spo2Drift = Math.floor(Math.random() * 3) - 1;
            updateDisplay();
        }
    }, 10000);
}

// ==================== SOCKET ====================
socket.on('connect', function() {
    socket.emit('join', { room: roomCode, type: 'monitor' });
    document.getElementById('conn_dot').classList.add('online');
    document.getElementById('sys_status_text').innerText = 'Connected';
    document.getElementById('sys_status_text').style.color = '';
});

socket.on('disconnect', function() {
    document.getElementById('conn_dot').classList.remove('online');
    document.getElementById('sys_status_text').innerText = 'Offline';
    document.getElementById('sys_status_text').style.color = '';
});

socket.on('connect_error', function() {
    document.getElementById('sys_status_text').innerText = 'Connection error';
    document.getElementById('sys_status_text').style.color = 'var(--red)';
});

// Controller OFF button — back to the standby screen (the scenario is replayed on reconnect)
socket.on('system_shutdown_trigger', function() { location.reload(); });

socket.on('update_monitor', function(data) {
    if (data.type === 'vitals') {
        targetHR = data.hr;
        targetSpO2 = data.spo2;

        if (data.hr_conn && !hr_on) {
            calc_hr = true;
            setTimeout(function() { calc_hr = false; updateDisplay(); }, 2000);
        }
        if (data.spo2_conn && !spo2_on) {
            calc_spo2 = true;
            setTimeout(function() { calc_spo2 = false; updateDisplay(); }, 2000);
        }

        hr_on = data.hr_conn;
        spo2_on = data.spo2_conn;
        signalQuality = data.signal_quality || 'normal';
        updateDisplay();
    }
    else if (data.type === 'system_reset') { location.reload(); }
    else if (data.type === 'push_temp') {
        var tempEl = document.getElementById('temp_v');
        tempEl.innerText = parseFloat(data.temp).toFixed(1);
        tempEl.className = 'card-value active';
        checkAlarms();
    }
    else if (data.type === 'set_target_bp') {
        t_sys = data.sys;
        t_dia = data.dia;
        bp_attached = data.bp_conn;
        updateDisplay();
    }
});

// ==================== BP CYCLE ====================
function runBP() {
    if (cycling || !bp_attached) return;
    cycling = true;

    var btn = document.getElementById('bp_btn');
    var sysEl = document.getElementById('sys_v');
    var diaEl = document.getElementById('dia_v');

    btn.disabled = true;
    sysEl.innerText = '---';
    diaEl.innerText = '---';
    sysEl.className = 'card-value blinking';
    diaEl.className = 'card-value blinking';
    btn.classList.add('inflating');
    btn.classList.remove('measuring');

    var pressure = 0;
    var inflateInterval = setInterval(function() {
        pressure += 15;
        btn.innerHTML = '<span class="bp-icon">⊘</span><span class="bp-pressure">' + pressure + '</span>mmHg';
        if (pressure >= 180) {
            clearInterval(inflateInterval);
            btn.classList.remove('inflating');
            btn.classList.add('measuring');
            btn.innerHTML = '<span class="bp-icon">⊘</span><span class="bp-pressure">Measuring</span>';

            setTimeout(function() {
                sysEl.classList.remove('blinking');
                diaEl.classList.remove('blinking');
                // the cuff needs arterial pulsation to measure
                if (parseInt(targetHR) === 0) {
                    sysEl.innerHTML = '<span class="card-message">---</span>';
                    diaEl.innerHTML = '<span class="card-message">---</span>';
                    sysEl.className = 'card-value'; diaEl.className = 'card-value';
                    document.getElementById('map_display').innerText = 'No reading';
                    document.getElementById('sys_timestamp').innerText = '';
                    document.getElementById('dia_timestamp').innerText = '';
                    btn.classList.remove('measuring');
                    btn.innerHTML = '<span class="bp-icon">⊘</span>Start BP';
                    btn.disabled = false;
                    cycling = false;
                    checkAlarms();
                    return;
                }
                sysEl.innerText = t_sys;
                diaEl.innerText = t_dia;
                sysEl.className = 'card-value active';
                diaEl.className = 'card-value active';

                var map = calculateMAP(t_sys, t_dia);
                document.getElementById('map_display').innerText = 'MAP ' + map;
                var ts = getCurrentTimestamp();
                document.getElementById('sys_timestamp').innerText = ts;
                document.getElementById('dia_timestamp').innerText = ts;

                btn.classList.remove('measuring');
                btn.innerHTML = '<span class="bp-icon">⊘</span>Start BP';
                btn.disabled = false;
                cycling = false;
                checkAlarms();
            }, 3000);
        }
    }, 300);
}

// ==================== SCREEN WAKE LOCK ====================
// Keeps phones/tablets from dimming or locking while the monitor is on.
var isPoweredOn = false;
var wakeLock = null;
function requestWakeLock() {
    if (!('wakeLock' in navigator) || !isPoweredOn) return;
    navigator.wakeLock.request('screen').then(function(lock) { wakeLock = lock; }).catch(function() {});
}
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') requestWakeLock();
});

// ==================== FULLSCREEN ====================
function toggleFullscreen() {
    var isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (isFs) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
        var el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
}
</script>
