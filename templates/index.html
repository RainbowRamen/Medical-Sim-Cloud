<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimMonitor — patient monitor simulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
    <style>
        /* Same visual language as the Advanced monitor: monitor black, ECG green, condensed numerals. */
        :root {
            --bg: #000; --panel: #15181c; --line: #262b31; --text: #e9ecef; --text-dim: #8a929b;
            --ecg: #00e676; --spo2: #29d3ff; --error: #ff5a5f;
            --num: 'Barlow Condensed', 'Arial Narrow', sans-serif;
            --ui: 'Barlow', -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: var(--ui); min-height: 100vh; }
        button, input { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--ecg); outline-offset: 3px; }

        /* The one memorable element: a single ECG sweep across the top, written once on load */
        .trace { display: block; width: 100%; height: 120px; border-bottom: 1px solid var(--line); }
        .trace path { fill: none; stroke: var(--ecg); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round;
                      stroke-dasharray: 3200; stroke-dashoffset: 3200; animation: sweep 2.6s linear forwards; }
        @keyframes sweep { to { stroke-dashoffset: 0; } }
        @media (prefers-reduced-motion: reduce) { .trace path { animation: none; stroke-dashoffset: 0; } }

        main { max-width: 760px; margin: 0 auto; padding: 32px 20px 48px; }
        h1 { font-family: var(--num); font-size: 56px; font-weight: 600; line-height: 1; letter-spacing: -0.5px; }
        .intro { margin-top: 10px; font-size: 18px; line-height: 1.5; color: var(--text-dim); max-width: 34em; }

        .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 32px; }
        .mode {
            text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
            padding: 18px; cursor: pointer; display: flex; flex-direction: column; gap: 8px;
            transition: border-color 0.15s;
        }
        .mode:hover { border-color: #3a4048; }
        .mode:active { transform: translateY(1px); }
        .mode h2 { font-size: 22px; font-weight: 600; }
        .mode p { font-size: 15px; line-height: 1.45; color: var(--text-dim); }
        .mode .go { margin-top: auto; padding-top: 6px; font-weight: 600; font-size: 15px; }
        .mode.advanced { border-top: 3px solid var(--ecg); } .mode.advanced .go { color: var(--ecg); }
        .mode.spot { border-top: 3px solid var(--spo2); } .mode.spot .go { color: var(--spo2); }

        .join { margin-top: 36px; padding-top: 24px; border-top: 1px solid var(--line); }
        .join h2 { font-size: 18px; font-weight: 600; }
        .join p { margin-top: 4px; font-size: 15px; color: var(--text-dim); line-height: 1.45; }
        .join-input-row { display: flex; gap: 10px; margin-top: 14px; max-width: 420px; }
        .join-input {
            flex: 1; min-width: 0; height: 52px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line);
            background: var(--panel); font-family: var(--num); font-size: 28px; font-weight: 600;
            letter-spacing: 8px; text-transform: uppercase; text-align: center;
        }
        .join-input::placeholder { color: #3d434b; letter-spacing: 8px; }
        .join-input:focus { border-color: var(--ecg); outline: none; }
        .join-btn {
            height: 52px; padding: 0 22px; border-radius: 8px; border: 0; background: var(--ecg); color: #000;
            font-weight: 600; font-size: 16px; cursor: pointer;
        }
        .join-btn:disabled { opacity: 0.5; cursor: default; }
        .join-status { min-height: 22px; margin-top: 8px; font-size: 14px; color: var(--text-dim); }
        .join-status.error { color: var(--error); }
        .join-status.success { color: var(--ecg); }

        footer { max-width: 760px; margin: 0 auto; padding: 0 20px 32px; font-size: 13px; color: #4b525b; }

        @media (max-width: 560px) {
            .modes { grid-template-columns: 1fr; }
            h1 { font-size: 44px; }
            .trace { height: 90px; }
        }
    </style>
</head>
<body>
    <svg class="trace" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 70 H60 q8 -8 16 0 H118 l4 6 l8 -58 l8 70 l5 -18 H168 q18 -18 36 0 H300 q8 -8 16 0 H358 l4 6 l8 -58 l8 70 l5 -18 H408 q18 -18 36 0 H540 q8 -8 16 0 H598 l4 6 l8 -58 l8 70 l5 -18 H648 q18 -18 36 0 H780 q8 -8 16 0 H838 l4 6 l8 -58 l8 70 l5 -18 H888 q18 -18 36 0 H1020 q8 -8 16 0 H1078 l4 6 l8 -58 l8 70 l5 -18 H1128 q18 -18 36 0 H1200"/>
    </svg>

    <main>
        <h1>SimMonitor</h1>
        <p class="intro">A patient monitor for simulation training. Show the monitor on one device and control the patient from another.</p>

        <div class="modes">
            <button class="mode advanced" onclick="start('advanced')">
                <h2>Advanced monitor</h2>
                <p>ECG, pleth, arterial line and capnography with 15 rhythms, CPR and defibrillation, and standard alarm sounds.</p>
                <span class="go">Start a session</span>
            </button>
            <button class="mode spot" onclick="start('basic')">
                <h2>Spot check</h2>
                <p>Numeric vital signs for ward scenarios: blood pressure, SpO₂, pulse and temperature.</p>
                <span class="go">Start a session</span>
            </button>
        </div>

        <section class="join">
            <h2>Connect a monitor</h2>
            <p>Enter the 4-character code shown on the controller, or scan its QR code.</p>
            <div class="join-input-row">
                <input type="text" class="join-input" id="room_code" placeholder="CODE" maxlength="4"
                       autocomplete="off" autocapitalize="characters" aria-label="Session code"
                       oninput="this.value = this.value.toUpperCase()">
                <button class="join-btn" id="join_btn" onclick="joinRoom()">Connect</button>
            </div>
            <div class="join-status" id="join_status" role="status"></div>
        </section>
    </main>
    <footer>For training use only. Not a medical device.</footer>

    <script>
        function start(mode) {
            var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            var room = '';
            for (var i = 0; i < 4; i++) {
                room += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            window.location.href = '/control?room=' + room + '&mode=' + mode;
        }

        function joinRoom() {
            var code = document.getElementById('room_code').value.trim().toUpperCase();
            var status = document.getElementById('join_status');
            var btn = document.getElementById('join_btn');

            if (code.length !== 4) {
                status.className = 'join-status error';
                status.innerText = 'Session codes have 4 characters.';
                return;
            }

            btn.disabled = true;
            status.className = 'join-status';
            status.innerText = 'Finding session ' + code + '…';

            // The server knows which monitor type the session uses
            fetch('/api/room/' + code)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.exists) {
                        status.className = 'join-status success';
                        status.innerText = 'Found. Opening the ' + (data.mode === 'advanced' ? 'advanced monitor' : 'spot check monitor') + '…';
                        setTimeout(function() {
                            window.location.href = '/monitor?room=' + code + '&mode=' + data.mode;
                        }, 400);
                    } else {
                        status.className = 'join-status error';
                        status.innerText = 'No session with code ' + code + '. Check the code on the controller.';
                        btn.disabled = false;
                    }
                })
                .catch(function() {
                    // Server unreachable for the lookup: fall back to the advanced monitor
                    window.location.href = '/monitor?room=' + code + '&mode=advanced';
                });
        }

        document.getElementById('room_code').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') joinRoom();
        });
    </script>
</body>
</html>
